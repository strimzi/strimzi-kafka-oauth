name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release Version (e.g., 0.15.0 for GA or 0.15.0-rc1 for RC)'
        required: true
        type: string

# Declare default permissions as read only
permissions:
  contents: read

jobs:
  release-artifacts:
    name: Release OAuth artifacts to Maven Central
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          javaVersion: "17"

      - name: Prepare release artifacts
        uses: strimzi/github-actions/.github/actions/build/release-artifacts@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          releaseVersion: ${{ inputs.releaseVersion }}
          artifactSuffix: "kafka-oauth"

      - name: Deploy to Maven Central
        uses: strimzi/github-actions/.github/actions/build/deploy-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          modules: "!examples/producer','!examples/consumer"
          gpgPassphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpgSigningKey: ${{ secrets.GPG_SIGNING_KEY }}
          centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          centralPassword: ${{ secrets.CENTRAL_PASSWORD }}

  snyk-scan:
    name: Snyk Scan
    needs:
      - release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/snyk.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  fossa-scan:
    name: FOSSA Scan
    needs:
      - release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fossa.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
