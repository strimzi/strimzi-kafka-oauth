name: GitHub Actions Integration

on:
  pull_request:
    paths:
      - '.github/**'
      - '**/pom.xml'
      - 'Makefile'
      - 'Makefile.maven'
      - 'Makefile.os'
    branches:
      - "*"
  push:
    branches:
      - "main"
    paths:
      - '.github/**'
      - '**/pom.xml'
      - 'Makefile'
      - 'Makefile.maven'
      - 'Makefile.os'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-github-actions-integration:
    uses: strimzi/github-actions/.github/workflows/reusable-test-integrations.yml@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.sha }}
      architecture: "amd64"
      artifactSuffix: "kafka-oauth"
      buildContainers: false
      modules: "!examples/producer','!examples/consumer"
      nexusCheck: "kafka-oauth-common"
      javaVersion: "17"
      helmChartName: "none"
      releaseVersion: "6.6.6"
      imagesLocation: "none"
    secrets: inherit
