apiVersion: v1
kind: Service
metadata:
  name: spring
  labels:
    app: spring
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: spring
  type: NodePort

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring
  template:
    metadata:
      labels:
        app: spring
    spec:
      containers:
        - name: spring
          # you may need to adjust image coordinates
          image: default/example-spring
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
